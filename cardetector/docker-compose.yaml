services:

  # ─── Car detector ───────────────────────────────────────────────────────────
  # Stateless: consumes decoded-frames (any camera, any partition Kafka
  # assigns it), runs YOLO vehicle detection, publishes to car-detections.
  # Scale via replicas, same as decoder — no per-camera config needed here.
  cardetector:
    build:
      context: ..
      dockerfile: cardetector/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      DECODED_FRAMES_TOPIC: ${DECODED_FRAMES_TOPIC:-decoded-frames}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-car-detector}
      CONFIDENCE_FLOOR: ${CONFIDENCE_FLOOR:-0.3}
      SAMPLE_EVERY_N_FRAMES: ${SAMPLE_EVERY_N_FRAMES:-1}
      DEVICE: ${DEVICE:-}
    restart: unless-stopped

networks:
  default:
    name: vms-local
    external: true
