services:

  # ─── Decoder ────────────────────────────────────────────────────────────────
  # Stateful H264 decoder: one consumer-group member, scaled via replicas.
  decoder:
    build: .
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-decoder}
      INPUT_TOPIC: ${INPUT_TOPIC:-raw-frames}
      OUTPUT_TOPIC: ${OUTPUT_TOPIC:-decoded-frames}
      JPEG_QUALITY: ${JPEG_QUALITY:-85}
      COMMIT_EVERY: ${COMMIT_EVERY:-25}
    restart: unless-stopped

networks:
  default:
    name: vms-local
    external: true
