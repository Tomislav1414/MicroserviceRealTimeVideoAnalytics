services:

  # ─── Frame grabber ─────────────────────────────────────────────────────────
  grabber:
    build: .
    container_name: grabber
    environment:
      CAMERAS: ${CAMERAS:-cam/cam1,cam/cam2,cam/cam3,cam/cam4,cam/cam7,cam/cam8}
      MEDIAMTX_HOST: ${MEDIAMTX_HOST:-mediamtx}
      MEDIAMTX_PORT: ${MEDIAMTX_PORT:-8554}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-raw-frames}
    restart: unless-stopped

networks:
  default:
    name: vms-local
    external: true
