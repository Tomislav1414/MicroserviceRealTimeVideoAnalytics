services:

  # ─── session-sse ────────────────────────────────────────────────────────────
  session-sse:
    build: .
    container_name: session-sse
    ports:
      - "${SESSION_SSE_PORT:-8095}:8095"
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      SESSIONS_TOPIC: ${SESSIONS_TOPIC:-sessions}
      HTTP_ADDR: ${HTTP_ADDR:-:8095}
      MAX_CACHE_SESSIONS: ${MAX_CACHE_SESSIONS:-5000}
    restart: unless-stopped

networks:
  default:
    name: vms-local
    external: true
