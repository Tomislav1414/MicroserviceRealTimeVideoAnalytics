[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detectorsdk"
version = "0.1.0"
description = "Shared Kafka publishing/consuming client for VMS detector services"
requires-python = ">=3.10"
dependencies = ["confluent-kafka>=2.4", "numpy>=1.26", "opencv-python-headless>=4.9"]

[tool.setuptools.packages.find]
where = ["src"]
