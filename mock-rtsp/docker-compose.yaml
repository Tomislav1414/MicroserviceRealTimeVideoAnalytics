services:

  # ─── MediaMTX ────────────────────────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "8000:8000/udp" # RTP (RTSP over UDP)
      - "8001:8001/udp" # RTCP (RTSP over UDP)
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC (WHEP)
      - "8189:8189/udp" # WebRTC ICE/UDP media
      - "9997:9997"   # HTTP API / metrics
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

  # ─── Mock Camera cam1 (human detection room) ──────────────────────────────────
  mock-cam-cam1:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam1
    environment:
      CAM_ID: cam/cam1
      VIDEO_PATH: /videos/hum_det.mp4
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam2 (car passing) ────────────────────────────────────────────
  mock-cam-cam2:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam2
    environment:
      CAM_ID: cam/cam2
      VIDEO_PATH: /videos/carPassing.mp4
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam3 (worker zone) ─────────────────────────────────────────────
  mock-cam-cam3:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam3
    environment:
      CAM_ID: cam/cam3
      VIDEO_PATH: /videos/worker_zone.mp4
      OUTPUT_FPS: "12"
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam4 (store aisle) ─────────────────────────────────────────────
  mock-cam-cam4:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam4
    environment:
      CAM_ID: cam/cam4
      VIDEO_PATH: /videos/store_aisle.mp4
      # Source clip is native ~60fps, well above the pipeline's 12fps design
      # — capped to match cam1/cam2 and keep decode/detection real-time
      # (see entrypoint.sh).
      OUTPUT_FPS: "12"
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam5 (FP30, stream-only) ───────────────────────────────────────
  mock-cam-cam5:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam5
    environment:
      CAM_ID: cam/cam5
      VIDEO_PATH: /videos/fp30.mp4
      OUTPUT_FPS: "12"
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam6 (FP15, stream-only) ───────────────────────────────────────
  mock-cam-cam6:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam6
    environment:
      CAM_ID: cam/cam6
      VIDEO_PATH: /videos/fp15.mp4
      OUTPUT_FPS: "12"
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam7 (living room fire, fire/smoke detection) ──────────────────
  mock-cam-cam7:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam7
    environment:
      CAM_ID: cam/cam7
      VIDEO_PATH: /videos/hfsc_livingroom_fire.mp4
      OUTPUT_FPS: "12"
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Camera cam8 (room fire, fire/smoke detection) ─────────────────────────
  mock-cam-cam8:
    build: ./mock-cam
    image: mock-cam:latest
    container_name: mock-cam-cam8
    environment:
      CAM_ID: cam/cam8
      VIDEO_PATH: /videos/roomfire41.mp4
      OUTPUT_FPS: "12"
      RTSP_HOST: mediamtx
      RTSP_PORT: 8554
    volumes:
      - ./videos:/videos
    depends_on:
      - mediamtx
    restart: unless-stopped

  # ─── Mock Cam Controller API ──────────────────────────────────────────────────
  mock-cam-controller:
    build: ./mock-cam-controller
    container_name: mock-cam-controller
    ports:
      - "3000:3000"
    environment:
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_PUBLIC_HOST: localhost
      MEDIAMTX_PORT: 8554
      VIDEOS_PATH: /videos
      VIDEOS_FROM: mock-cam-controller
      # In local mode, controller manages docker containers (not k8s pods)
      MODE: docker
      DOCKER_NETWORK: vms-local
      CAM_IMAGE: mock-cam:latest
    volumes:
      - ./videos:/videos
      - /var/run/docker.sock:/var/run/docker.sock  # needed to spawn containers
    depends_on:
      - mediamtx
    restart: unless-stopped

networks:
  default:
    name: vms-local
    external: true